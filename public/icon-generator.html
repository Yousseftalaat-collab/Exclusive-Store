<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create PWA Icons</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      .container {
        background: white;
        border-radius: 20px;
        padding: 40px;
        max-width: 600px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }
      h1 {
        color: #333;
        margin-bottom: 10px;
        font-size: 28px;
      }
      p {
        color: #666;
        margin-bottom: 30px;
      }
      .icon-preview {
        display: flex;
        gap: 20px;
        margin: 30px 0;
        justify-content: center;
        flex-wrap: wrap;
      }
      .icon-box {
        text-align: center;
      }
      canvas {
        border: 2px solid #ddd;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      .size-label {
        margin-top: 10px;
        font-weight: bold;
        color: #667eea;
      }
      button {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 15px 30px;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        width: 100%;
        margin-top: 20px;
        transition: transform 0.2s;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }
      .instructions {
        background: #f8f9fa;
        padding: 20px;
        border-radius: 10px;
        margin-top: 20px;
        border-left: 4px solid #667eea;
      }
      .instructions h3 {
        color: #333;
        margin-bottom: 10px;
      }
      .instructions ol {
        margin-left: 20px;
        color: #666;
      }
      .instructions li {
        margin: 5px 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎨 PWA Icon Generator</h1>
      <p>Generate placeholder icons for your Exclusive Store PWA</p>

      <div class="icon-preview">
        <div class="icon-box">
          <canvas id="icon192" width="192" height="192"></canvas>
          <div class="size-label">192x192</div>
        </div>
        <div class="icon-box">
          <canvas id="icon512" width="512" height="512"></canvas>
          <div class="size-label">512x512</div>
        </div>
      </div>

      <button onclick="downloadIcons()">📥 Download Both Icons</button>

      <div class="instructions">
        <h3>📋 Next Steps:</h3>
        <ol>
          <li>Click "Download Both Icons" above</li>
          <li>Save the files to your <code>public/</code> folder</li>
          <li>Run <code>npm run build</code></li>
          <li>Run <code>npm run preview</code></li>
          <li>Test PWA installation!</li>
        </ol>
      </div>
    </div>

    <script>
      // Draw icon on canvas
      function drawIcon(canvas, size) {
        const ctx = canvas.getContext("2d");

        // Background
        const gradient = ctx.createLinearGradient(0, 0, size, size);
        gradient.addColorStop(0, "#DB4444");
        gradient.addColorStop(1, "#FF6B6B");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, size, size);

        // Shopping bag icon
        ctx.fillStyle = "white";
        ctx.strokeStyle = "white";
        ctx.lineWidth = size * 0.04;

        // Bag body
        const bagWidth = size * 0.5;
        const bagHeight = size * 0.5;
        const bagX = (size - bagWidth) / 2;
        const bagY = size * 0.3;

        ctx.beginPath();
        ctx.moveTo(bagX + bagWidth * 0.1, bagY);
        ctx.lineTo(bagX + bagWidth * 0.9, bagY);
        ctx.lineTo(bagX + bagWidth, bagY + bagHeight);
        ctx.lineTo(bagX, bagY + bagHeight);
        ctx.closePath();
        ctx.fill();

        // Handle
        ctx.beginPath();
        ctx.arc(
          bagX + bagWidth * 0.5,
          bagY - size * 0.05,
          bagWidth * 0.25,
          0,
          Math.PI,
          true,
        );
        ctx.stroke();

        // Letter "E"
        ctx.font = `bold ${size * 0.3}px Arial`;
        ctx.fillStyle = "#DB4444";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("E", size / 2, bagY + bagHeight / 2);
      }

      // Draw both icons
      drawIcon(document.getElementById("icon192"), 192);
      drawIcon(document.getElementById("icon512"), 512);

      // Download function
      function downloadIcons() {
        // Download 192x192
        const canvas192 = document.getElementById("icon192");
        const link192 = document.createElement("a");
        link192.download = "pwa-192x192.png";
        link192.href = canvas192.toDataURL("image/png");
        link192.click();

        // Download 512x512
        setTimeout(() => {
          const canvas512 = document.getElementById("icon512");
          const link512 = document.createElement("a");
          link512.download = "pwa-512x512.png";
          link512.href = canvas512.toDataURL("image/png");
          link512.click();
        }, 500);

        alert("✅ Icons downloaded! Save them to your public/ folder");
      }
    </script>
  </body>
</html>
